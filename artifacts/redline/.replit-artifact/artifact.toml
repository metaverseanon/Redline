kind = "mobile"
previewPath = "/"
title = "RedLine"
version = "1.0.0"
id = "artifacts/redline"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18735

[services.development]
run = "pnpm --filter @workspace/redline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/redline", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/redline", "run", "serve" ]

[services.env]
PORT = "18735"
BASE_PATH = "/"
